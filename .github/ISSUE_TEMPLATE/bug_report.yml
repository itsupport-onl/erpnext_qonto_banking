name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste credentials.** Redact API login/secret, staging tokens, real IBANs,
        account holder names and transaction IDs before posting logs or screenshots.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: qonto_banking version
      placeholder: 0.0.1 or commit sha
    validations:
      required: true

  - type: input
    id: frappe-version
    attributes:
      label: Frappe / ERPNext version
      placeholder: 'frappe 15.x, erpnext 15.x'
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Qonto environment
      options:
        - Production
        - Sandbox
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Qonto Sync Log entry and/or Error Log — redacted.
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I removed all credentials and personal data from this report
          required: true
